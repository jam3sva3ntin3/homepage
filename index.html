    <style>
        /* Reset default margins and padding */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000; /* Black background */
            color: #fff; /* White text */
            font-family: 'Metal Mania', cursive;
            font-size: 2.625rem; /* 25% smaller than 3.5rem */
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Navigation Bar */
        .navbar {
            text-align: center;
            margin-bottom: 30px;
        }

        .navbar ul {
            list-style-type: none;
            padding: 0;
            display: none; /* Hidden by default */
            flex-direction: column;
            align-items: center;
        }

        .navbar ul li {
            margin: 10px 0;
        }

        .navbar ul li a {
            color: white;
            text-decoration: none;
            font-size: 35px;
        }

        .navbar ul li a:hover {
            color: #00aced;
        }

        /* Toggle button for mobile view */
        .menu-toggle {
            display: block;
            cursor: pointer;
            color: white;
            font-size: 30px;
            text-align: right;
            margin-right: 20px;
        }

        /* Show the menu when the checkbox is checked */
        input[type="checkbox"]:checked ~ .navbar ul {
            display: flex;
            flex-direction: column;
        }

        /* Responsive styles for larger screens */
        @media (min-width: 769px) {
            .navbar ul {
                flex-direction: row;
                display: flex; /* Show menu by default on larger screens */
            }

            .menu-toggle {
                display: none; /* Hide toggle button on larger screens */
            }

            .navbar ul li {
                margin-right: 20px;
            }
        }

        /* Social button styling */
        .social-buttons {
            margin-top: 10px;
            text-align: center;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .social-buttons a {
            margin: 10px;
            font-size: 24px;
            color: white;
            text-decoration: none;
            display: inline-block;
        }

        .social-buttons a:hover {
            color: #00aced;
        }

        /* Ensures all social buttons show properly */
        .social-buttons i {
            font-size: 48px; /* Increase icon size for better visibility */
        }

        /* Responsive media query for smaller screens */
        @media (max-width: 768px) {
            body {
                font-size: 1.5rem; /* Adjust for smaller screens */
                padding: 20px;
            }
        }
    </style>
</head>
